<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("fonts/cormorant.woff2") format("woff2");
      font-weight: 600 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Figtree";
      src: url("fonts/figtree.woff2") format("woff2");
      font-weight: 500 600;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 264px;
      overflow: hidden;
      background: #08070b;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 264px;
      background:
        radial-gradient(ellipse 55% 120% at 78% 50%, rgba(196, 92, 74, 0.22), transparent 58%),
        radial-gradient(ellipse 40% 100% at 12% 30%, rgba(232, 228, 220, 0.07), transparent 60%),
        #08070b;
      color: #e8e4dc;
    }
    .vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 90px 28px #08070b;
      pointer-events: none;
    }
    .grain {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.14;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    .art { position: absolute; inset: 0; }
    .lockup {
      position: absolute;
      left: 56px;
      top: 48px;
      width: 520px;
    }
    h1 {
      font-family: "Cormorant Garamond", "Liberation Serif", serif;
      font-weight: 700;
      font-size: 58px;
      letter-spacing: 0.16em;
      line-height: 1;
      color: #e8e4dc;
      text-shadow: 0 0 22px rgba(196, 92, 74, 0.4);
    }
    .rule {
      display: block;
      width: 120px;
      height: 1px;
      margin: 14px 0 10px;
      background: linear-gradient(90deg, #c45c4a, #e8e4dc 60%, transparent);
      opacity: 0.9;
    }
    .tag {
      font-family: "Figtree", "Liberation Sans", sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #c45c4a;
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg class="art" viewBox="0 0 1200 264" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="ember" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c45c4a" stop-opacity="0.95"/>
          <stop offset="55%" stop-color="#c45c4a" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#c45c4a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="moon" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e8e4dc" stop-opacity="0.95"/>
          <stop offset="50%" stop-color="#e8e4dc" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#e8e4dc" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ashg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#8a8580" stop-opacity="0.9"/>
          <stop offset="60%" stop-color="#1c1a22" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#1c1a22" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="930" cy="132" r="92" fill="none" stroke="#c45c4a" stroke-opacity="0.18" stroke-width="1"/>
      <circle cx="930" cy="132" r="128" fill="none" stroke="#e8e4dc" stroke-opacity="0.08" stroke-width="1"/>
      <path d="M930 28 L1048 220 H812 Z" fill="none" stroke="#c45c4a" stroke-opacity="0.42" stroke-width="2"/>
      <path d="M930 58 L1018 204 H842 Z" fill="none" stroke="#e8e4dc" stroke-opacity="0.12" stroke-width="1.5"/>
      <rect x="927" y="78" width="6" height="78" rx="1" fill="#e8e4dc" fill-opacity="0.16"/>
      <circle cx="930" cy="28" r="28" fill="url(#moon)"/>
      <circle cx="930" cy="28" r="5" fill="#e8e4dc"/>
      <circle cx="812" cy="220" r="30" fill="url(#ember)"/>
      <circle cx="812" cy="220" r="5" fill="#c45c4a"/>
      <circle cx="1048" cy="220" r="28" fill="url(#ashg)"/>
      <circle cx="1048" cy="220" r="5" fill="#8a8580"/>
    </svg>
    <div class="lockup">
      <h1>AETHERWAKE</h1>
      <span class="rule"></span>
      <div class="tag">Awaken the three</div>
    </div>
    <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <filter id="n">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#n)"/>
    </svg>
    <div class="vignette"></div>
  </div>
</body>
</html>
